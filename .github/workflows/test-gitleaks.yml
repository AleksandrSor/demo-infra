name: scan-gitleaks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}