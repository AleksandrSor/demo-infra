name: main-prt
on:
  pull_request_target:
    branches:
      - main
      - feature/pipeline-2
    types: [opened, synchronize, reopened]

jobs:
  plan:
    uses: ./.github/workflows/plan-IaC.yml
    secrets: inherit
    permissions:
        contents: read  # Required for checkout and gitleaks
        id-token: write # Required to request OIDC token for Terraform Cloud API authentication
        pull-requests: write # Required to auto-approve PRs created by dependabot