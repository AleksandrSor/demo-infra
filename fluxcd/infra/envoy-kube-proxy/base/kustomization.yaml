apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-kube-proxy

resources:
- namespace.yaml
- deployment.yaml
- service.yaml

configMapGenerator:
- name: envoy-kube-proxy-config
  files:
  - envoy.yaml

images:
  - name: envoyproxy/envoy          # Matches this original image name in your manifests
    newTag: v1.37-latest            # (Optional) Updates the tag