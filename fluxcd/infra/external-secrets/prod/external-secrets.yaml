apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  values:
    global:
      tolerations:
        - effect: NoSchedule
          key: CriticalAddonsOnly
          operator: Exists
        - effect: NoSchedule
          key: role.core
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: role.core
                operator: Exists