apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infra/flux-instance/prod
  dependsOn:
    - name: flux-operator
  prune: true
  interval: 10m
  timeout: 5m