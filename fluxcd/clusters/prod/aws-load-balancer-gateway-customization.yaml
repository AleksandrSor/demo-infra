apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-load-balancer-gateway-customization
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infra/aws-load-balancer-gateway-customization/prod
  dependsOn:
    - name: aws-load-balancer-controller
  prune: true
  interval: 1h
  timeout: 5m