apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infra/external-dns/prod
  dependsOn:
    - name: aws-load-balancer-controller
  prune: true
  interval: 30m
  timeout: 5m