apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-load-balancer-controller
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./fluxcd/infra/aws-load-balancer-controller/prod
  prune: true
  interval: 30m
  retryInterval: 5m
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: alb-params