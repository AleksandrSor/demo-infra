apiVersion: gateway.k8s.aws/v1
kind: ListenerRuleConfiguration
metadata:
  name: webapp-route-jwt-validation
spec:
  actions:
    - type: "jwt-validation"
      jwtValidationConfig:
        jwksEndpoint: "https://lemur-1.cloud-iam.com/auth/realms/demo-infra-project/protocol/openid-connect/certs"
        issuer: "https://lemur-1.cloud-iam.com/auth/realms/demo-infra-project"
        additionalClaims:
          - name: "azp"
            format: "single-string"
            values: ["demo-infra-kube-api"]