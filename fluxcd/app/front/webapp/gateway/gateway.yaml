apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: webapp-gateway
  namespace: prod-webapp
spec:
  gatewayClassName: aws-alb-gateway-internet-class
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          webapp: publish
  listeners:
    # There is currently no way to set zero listeners
    - name: http
      hostname: dummy
      protocol: HTTP
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: webapp-listener-set
  namespace: prod-webapp
spec:
  parentRef:
    name: webapp-gateway
    namespace: prod-webapp
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: http-host
      port: 80
      protocol: HTTP
      hostname: "webapp.example.com"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: webapp-route
  namespace: prod-webapp
spec:
  parentRefs:
    # - group: gateway.networking.k8s.io
    #   kind: Gateway
    #   name: webapp-gateway
    #   sectionName: http
    - kind: ListenerSet
      name: webapp-listener-set
      sectionName: http
    - kind: ListenerSet
      name: webapp-listener-set
      sectionName: http-host
  rules:
    - backendRefs:
        - name: webapp
          port: 9898